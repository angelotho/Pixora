[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pixora"
version = "1.1.0"
description = "Aplicativo desktop para baixar imagens de publicações públicas do Instagram."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.6",
    "instaloader>=4.14",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.5"]

[project.gui-scripts]
pixora = "pixora.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixora = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["network: testes que acessam o Instagram de verdade (desativados por padrão)"]
